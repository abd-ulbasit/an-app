# Keeps the pins in this repo current. Actions are pinned to commit SHAs and
# base images to digests; without update PRs those pins would quietly age
# and miss security fixes. Monthly and grouped to keep the PR count low.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directories:
      - /backend
      - /frontend
      - /db
    schedule:
      interval: monthly
    groups:
      base-images:
        patterns: ["*"]

  - package-ecosystem: npm
    directories:
      - /backend
      - /frontend
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types: ["minor", "patch"]
