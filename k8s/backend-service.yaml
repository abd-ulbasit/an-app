apiVersion: v1
kind: Service
metadata:
  name: backend
  annotations:
    # The ALB's default health check is GET / on the target, which the API
    # answers with 404, so every target showed unhealthy (and the ALB failed
    # open). Use the liveness endpoint instead.
    alb.ingress.kubernetes.io/healthcheck-path: /healthz
spec:
  selector:
    app: backend
  ports:
    - protocol: TCP
      port: 4000
      targetPort: 4000
  type: NodePort
