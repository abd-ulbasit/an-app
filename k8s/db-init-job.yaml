apiVersion: batch/v1
kind: Job
metadata:
  name: db-init
  namespace: default
spec:
  template:
    spec:
      containers:
        - name: psql
          image: postgres:15
          # psql reads the standard libpq PG* variables, so the password is
          # never part of the command line (visible in ps and /proc).
          env:
            - name: PGDATABASE
              value: "guestbook"
            - name: PGUSER
              value: "postgres"
            # db-secret is created out-of-band (k8s/setup.md), never from git.
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: POSTGRES_PASSWORD
            - name: PGHOST
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: RDS_ENDPOINT
            # Require TLS and verify the RDS certificate and hostname.
            - name: PGSSLMODE
              value: "verify-full"
            - name: PGSSLROOTCERT
              value: /etc/rds-ca/rds-ca-bundle.pem
          command: ["psql", "-v", "ON_ERROR_STOP=1", "-f", "/init/init.sql"]
          volumeMounts:
            - name: init-sql
              mountPath: /init
            - name: rds-ca
              mountPath: /etc/rds-ca
              readOnly: true
      restartPolicy: OnFailure
      volumes:
        - name: init-sql
          configMap:
            name: db-init-sql
        - name: rds-ca
          configMap:
            name: rds-ca-bundle
